# 只打印模板参数、不推送消息，用于检查配置是否正确
# 注意：公开仓库的 Actions 日志所有人可见，打印的内容中包含用户名称、纪念日等信息
name: weixin-push-on-time-params-log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  params-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # pnpm 版本读取自 package.json 中的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm start --params-log
        env:
          USERS: ${{ secrets.USERS }}
          TIAN_API: ${{ secrets.TIAN_API }}
          USER_INFO: ${{ secrets.USER_INFO }}
