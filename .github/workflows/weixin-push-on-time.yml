# 定时推送微信测试号模板消息
name: weixin-push-on-time

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 0:00 运行，即北京时间 8:00
    # GitHub Actions 的定时任务需要排队，实际执行时间可能会有延迟
    - cron: '0 0 * * *'

permissions:
  contents: read

# 避免手动运行与定时任务同时执行导致重复推送
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # pnpm 版本读取自 package.json 中的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 敏感信息只通过 Secrets 传给运行步骤，详见 README
      - run: pnpm start
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          USERS: ${{ secrets.USERS }}
          CALLBACK_TEMPLATE_ID: ${{ secrets.CALLBACK_TEMPLATE_ID }}
          CALLBACK_USERS: ${{ secrets.CALLBACK_USERS }}
          TIAN_API: ${{ secrets.TIAN_API }}
          USER_INFO: ${{ secrets.USER_INFO }}
